name: tests
on:
  push:
    paths-ignore: ["dist/picks.json", "bets/**"]     # the hourly model-picks commits
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - uses: actions/setup-node@v4
        with: { node-version: "20" }
      - run: pip install numpy pandas scipy requests pytest pbpstats
      - run: pytest -q tests
