name: cors-check
on: { push: { branches: [cors-check] } }
permissions: { contents: write }
jobs:
  c:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: |
          pip install -q requests
          cd update && python - <<'PY'
          import json, fetch_season as F
          j = F.get("https://cdn.nba.com/static/json/staticData/scheduleLeagueV2.json")
          out = [[g["gameId"], (g.get("gameDateEst") or "")[:10], g["homeTeam"]["teamTricode"], g["awayTeam"]["teamTricode"], g["homeTeam"].get("score"), g["awayTeam"].get("score"), g.get("gameStatus"), g.get("isNeutral")]
                 for d in j["leagueSchedule"]["gameDates"] for g in d["games"]]
          json.dump(out, open("../sched.json", "w"))
          print(len(out))
          PY
          cd .. && git config user.name bot && git config user.email bot@users.noreply.github.com && git add sched.json && git commit -m "sched result" && git push
