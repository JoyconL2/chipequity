name: cors-check
on: { push: { branches: [cors-check] } }
permissions: { contents: write }
jobs:
  c:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          u=https://cdn.nba.com/static/json/liveData/playbyplay/playbyplay_0022100002.json
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/130 Safari/537.36"
          rm -f cors.txt
          for o in none "https://example.netlify.app" "https://www.nba.com"; do
            echo "== origin $o" >> cors.txt
            if [ "$o" = none ]; then curl -sS -o /dev/null -D - -H "User-Agent: $UA" "$u" | grep -iE "^HTTP|access-control" >> cors.txt
            else curl -sS -o /dev/null -D - -H "User-Agent: $UA" -H "Origin: $o" -H "Referer: $o/" "$u" | grep -iE "^HTTP|access-control" >> cors.txt; fi
          done
          echo "== referer only netlify" >> cors.txt
          curl -sS -o /dev/null -D - -H "User-Agent: $UA" -H "Referer: https://example.netlify.app/" "$u" | grep -iE "^HTTP|access-control" >> cors.txt
          echo "== origin only netlify" >> cors.txt
          curl -sS -o /dev/null -D - -H "User-Agent: $UA" -H "Origin: https://example.netlify.app" "$u" | grep -iE "^HTTP|access-control" >> cors.txt
          git config user.name bot; git config user.email bot@users.noreply.github.com
          git add cors.txt; git commit -m "cors result"; git push
