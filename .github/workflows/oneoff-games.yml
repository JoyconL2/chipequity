name: oneoff games
on:
  push:
    branches: [oneoff-games]
    paths: ["oneoff/games.py", ".github/workflows/oneoff-games.yml"]
permissions:
  contents: write
jobs:
  games:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: python -m pip install --quiet requests
      - run: python oneoff/games.py
      - run: |
          git config user.name "oneoff[bot]"; git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add oneoff/games_2026-27.csv && git commit -qm "one-off: 2026-27 results" && git push
