name: headshot check
on:
  push:
    branches: [headshot-check]
jobs:
  t:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          for q in "Grant%20Long" "Michael%20Jordan" "Tim%20Duncan" "Antoine%20Walker"; do
            echo "== $q"; curl -s -A "Mozilla/5.0" "https://site.web.api.espn.com/apis/common/v3/search?query=$q&limit=3&type=player&sport=basketball&league=nba" | head -c 1500; echo
          done
          echo "== headshot Jordan 1035"; curl -s -o /tmp/o -w '%{http_code} ' -A "Mozilla/5.0" https://a.espncdn.com/i/headshots/nba/players/full/1035.png; wc -c </tmp/o
          echo "== headshot bogus"; curl -s -o /tmp/o -w '%{http_code} ' -A "Mozilla/5.0" https://a.espncdn.com/i/headshots/nba/players/full/99999999.png; wc -c </tmp/o
