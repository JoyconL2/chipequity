name: headshot check
on:
  push:
    branches: [headshot-check]
permissions:
  contents: write
jobs:
  t:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          sudo apt-get -qq install -y imagemagick >/dev/null
          mkdir -p th sheets
          python3 - <<'PY'
          import json, subprocess, urllib.parse, time
          M = json.load(open("alt_headshots.json")); names = dict(l.split("\t") for l in open("players.tsv").read().splitlines())
          W = [(p, v[1:]) for p, v in M.items() if v[0] == "w"]
          for j, (p, f) in enumerate(W):
              u = "https://commons.wikimedia.org/wiki/Special:FilePath/" + urllib.parse.quote(f) + "?width=160"
              r = subprocess.run(["curl", "-sL", "-o", f"th/{j:03d}_{p}.img", "-w", "%{http_code}", "-A", "chipequity-check/1.0 (github.com/JoyconL2/chipequity)", u], capture_output=True, text=True).stdout
              if r != "200": print("fail", r, p, f)
              time.sleep(0.15)
          open("labels.txt", "w").write("\n".join(f"{j:03d}_{p} {names.get(p,'')}" for j, (p, f) in enumerate(W)))
          PY
          ls th | wc -l
          cd th && i=0; ls | sort | split -l 48 - ../grp_ ; cd ..
          for g in grp_*; do args=(); while read f; do id=${f%.img}; args+=( -label "$(grep "^$id " labels.txt | cut -d' ' -f2-)" "th/$f[0]" ); done < $g
            montage "${args[@]}" -geometry 110x110+3+3 -tile 8x -pointsize 10 -background '#222' -fill white sheets/$g.jpg 2>/dev/null; done
          ls -la sheets
          git config user.name "headshot-check"; git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sheets && git commit -qm "contact sheets" && git push -q
