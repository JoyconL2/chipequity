name: headshot check
on:
  push:
    branches: [headshot-check]
permissions:
  contents: write
jobs:
  t:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          while read p; do [ "$(curl -s -A "Mozilla/5.0" "https://cdn.nba.com/headshots/nba/latest/260x190/$p.png" | md5sum | cut -c1-8)" = 7475ba96 ] && echo $p; done < ids.txt > sil.txt
          curl -s -G -H "Accept: text/csv" -A "chipequity-check/1.0 (github.com/JoyconL2/chipequity)" https://query.wikidata.org/sparql \
            --data-urlencode 'query=SELECT ?nba ?espn ?img WHERE { ?p wdt:P3647 ?nba . OPTIONAL { ?p wdt:P3685 ?espn } OPTIONAL { ?p wdt:P18 ?img } }' > wd.csv
          python3 - <<'PY'
          import csv, json, subprocess, urllib.parse
          wd = {}
          for r in csv.DictReader(open("wd.csv")):
              d = wd.setdefault(r["nba"].strip(), {"espn": "", "img": ""})
              d["espn"] = d["espn"] or r["espn"].strip(); d["img"] = d["img"] or r["img"].strip()
          names = dict(l.split("\t") for l in open("players.tsv").read().splitlines())
          sil = open("sil.txt").read().split()
          def code(u):
              return subprocess.run(["curl", "-s", "-o", "/dev/null", "-w", "%{http_code}", "-A", "Mozilla/5.0", u], capture_output=True, text=True).stdout
          def espn_search(n):
              out = subprocess.run(["curl", "-s", "-A", "Mozilla/5.0", "https://site.web.api.espn.com/apis/search/v2?limit=5&query=" + urllib.parse.quote(n)], capture_output=True, text=True).stdout
              try: J = json.loads(out)
              except Exception: return []
              hits = []
              for g in J.get("results", []):
                  for c in g.get("contents", []):
                      if c.get("type") == "player" and c.get("uid", "").startswith("s:40~l:46~a:") and c.get("displayName", "").lower() == n.lower():
                          hits.append(c["uid"].split("a:")[1])
              return hits
          M, src = {}, {"espn-wikidata": 0, "espn-search": 0, "wiki": 0, "none": 0}
          for p in sil:
              e = wd.get(p, {}).get("espn")
              if e and code(f"https://a.espncdn.com/i/headshots/nba/players/full/{e}.png") == "200":
                  M[p] = "e" + e; src["espn-wikidata"] += 1; continue
              if not e:
                  h = espn_search(names.get(p, ""))
                  if len(h) == 1 and code(f"https://a.espncdn.com/i/headshots/nba/players/full/{h[0]}.png") == "200":
                      M[p] = "e" + h[0]; src["espn-search"] += 1; continue
              img = wd.get(p, {}).get("img")
              if img:
                  M[p] = "w" + urllib.parse.unquote(img.rsplit("/", 1)[1]); src["wiki"] += 1; continue
              src["none"] += 1
          print("silhouettes:", len(sil), src)
          json.dump(M, open("alt_headshots.json", "w"), separators=(",", ":"), ensure_ascii=False)
          PY
          git config user.name "headshot-check"; git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add alt_headshots.json sil.txt && git commit -qm "alt headshots result" && git push -q
