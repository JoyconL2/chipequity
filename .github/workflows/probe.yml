name: probe pbpstats
# one-off check: can GitHub's servers read pbpstats.com's public API for the season being played? (reports only)
on: workflow_dispatch
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          python3 - <<'PY'
          import json, urllib.request, urllib.parse
          B = "https://api.pbpstats.com"
          q = lambda **k: urllib.parse.urlencode(k)
          G = "0022600001"
          tests = {
            "poss OKC 2026-27 Offense": "/get-possessions/nba?" + q(TeamId="1610612760", Season="2026-27", SeasonType="Regular Season", OffDef="Offense"),
            "poss OKC 2025-26 Offense": "/get-possessions/nba?" + q(TeamId="1610612760", Season="2025-26", SeasonType="Regular Season", OffDef="Offense"),
            "poss OKC 2025-26 Defense, Shai on": "/get-possessions/nba?" + q(TeamId="1610612760", Season="2025-26", SeasonType="Regular Season", OffDef="Defense", PlayerId1="1628983"),
          }
          for name, path in tests.items():
              try:
                  r = urllib.request.urlopen(urllib.request.Request(B + path, headers={"User-Agent": "Mozilla/5.0"}), timeout=60)
                  body = r.read(); j = json.loads(body)
                  info = {k: (len(v) if isinstance(v, (list, dict)) else str(v)[:40]) for k, v in j.items()} if isinstance(j, dict) else type(j).__name__
                  rows = j.get("multi_row_table_data") or j.get("results") or j.get("games") or j.get("possessions") or []
                  sample = list(rows[0].keys())[:12] if isinstance(rows, list) and rows and isinstance(rows[0], dict) else ""
                  print(f"::notice::{name}: HTTP {r.status}, {len(body)} bytes, keys {info} sample cols {sample}")
                  if isinstance(rows, list) and rows: print(f"::notice::{name} first row: {json.dumps(rows[0])[:1500]}")
              except urllib.error.HTTPError as e:
                  print(f"::notice::{name}: HTTP {e.code} {e.reason} body {e.read()[:600]!r}")
              except Exception as e:
                  print(f"::notice::{name}: {type(e).__name__}: {str(e)[:150]}")
          PY
