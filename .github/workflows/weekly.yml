name: daily update
# Every morning: download the night's NBA games, add them to the season being played, rebuild the site into
# dist/ and commit it (Netlify, linked to this repo with publish directory "dist", then deploys it).
# Runs on GitHub's servers. Run it by hand any time from the Actions tab ("Run workflow").
# (It also runs when this file, the update code or the site template changes, so a fix shows up right away.)
on:
  schedule:
    - cron: "17 10 * * *"        # every day 10:17 UTC (6:17 am Eastern in summer time, 5:17 am in winter), after the last West Coast game
  workflow_dispatch:
    inputs:
      season:
        description: "Season to update (blank = the one after the last finished season)"
        required: false
  push:
    branches: [main]
    paths: [".github/workflows/weekly.yml", "update/**", "stintbuild/**", "site/template.html", "loadout/**"]
permissions:
  contents: write
concurrency:
  group: daily-update
  cancel-in-progress: false
defaults:
  run:
    shell: bash          # with pipefail, so "| tee" doesn't hide a failure
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: python -m pip install --quiet numpy pandas scipy requests
      - name: pbpstats parser (same version the history was built with)
        run: python update/setup_pbp.py
      - name: games already downloaded (saves re-downloading the whole season every day)
        uses: actions/cache@v4
        with:
          path: live
          key: live-${{ github.run_id }}
          restore-keys: live-
      - name: update
        run: mkdir -p update/tmp && python update/run.py ${{ inputs.season && format('--season {0}', inputs.season) || '' }} --site-url "${{ vars.SITE_URL || 'https://YOUR-SITE.netlify.app' }}" 2>&1 | tee update/tmp/run_out.txt
      - name: commit the new site
        run: python update/commit.py
      - name: show what went wrong
        if: failure()
        run: python update/report_fail.py
      - name: logs
        if: failure()
        uses: actions/upload-artifact@v4
        with: { name: update-logs, path: update/tmp/*.log, if-no-files-found: ignore }
