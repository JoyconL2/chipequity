name: daily update
# Every morning: download the night's NBA games, add them to the season being played, rebuild the site into
# dist/ and commit it (Netlify, linked to this repo with publish directory "dist", then deploys it).
# Runs on YOUR computer (a self-hosted runner): NBA.com refuses downloads from GitHub's own servers.
# If the computer is off or asleep at run time, the run waits (up to a day) and starts once it's back.
# Run it by hand any time from the Actions tab ("Run workflow").
on:
  schedule:
    - cron: "17 10 * * *"        # every day 10:17 UTC (6:17 am Eastern in summer time, 5:17 am in winter), after the last West Coast game
  workflow_dispatch:
    inputs:
      season:
        description: "Season to update (blank = the one after the last finished season)"
        required: false
permissions:
  contents: write
concurrency:
  group: daily-update
  cancel-in-progress: false
jobs:
  update:
    runs-on: self-hosted
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
        with: { clean: false }            # keeps live/ (games already downloaded) and pbplib/ between runs
      - name: find Python (installed on the computer itself, "for all users"; 3.10 or newer)
        shell: powershell
        run: |
          $c = @()
          $g = Get-Command python -ErrorAction SilentlyContinue
          if ($g -and $g.Source -notlike "*WindowsApps*") { $c += $g.Source }
          $c += Get-ChildItem "C:\Program Files\Python3*\python.exe", "C:\Python3*\python.exe", "C:\Users\*\AppData\Local\Programs\Python\Python3*\python.exe" -ErrorAction SilentlyContinue | Sort-Object FullName -Descending | ForEach-Object FullName
          $ok = @()
          foreach ($p in $c) {
            $v = & $p -c "import sys; print('%d.%d' % sys.version_info[:2])" 2>$null
            if ($LASTEXITCODE -eq 0 -and [version]$v -ge [version]"3.10") { $ok += [pscustomobject]@{ p = $p; v = [version]$v } }
          }
          # prefer 3.10-3.13 (numpy / pandas / scipy have Windows installs for them); a newer one only if that's all there is
          $pick = @($ok | Where-Object { $_.v -le [version]"3.13" } | Sort-Object v -Descending) + @($ok | Where-Object { $_.v -gt [version]"3.13" } | Sort-Object v) | Select-Object -First 1
          if ($pick) {
            Split-Path $pick.p | Out-File -Append -Encoding utf8 $env:GITHUB_PATH
            (Join-Path (Split-Path $pick.p) "Scripts") | Out-File -Append -Encoding utf8 $env:GITHUB_PATH
            Write-Output "using Python $($pick.v) at $($pick.p)"; exit 0
          }
          Write-Output "::error::Python 3.10+ not found by the runner (it runs as its own Windows account). Install Python from python.org with 'Install Python for all users' ticked, then in admin PowerShell run: Restart-Service actions.runner.*   Looked at: $($c -join ', ')"
          exit 1
      - run: python -m pip install --quiet --upgrade numpy pandas scipy requests
      - name: pbpstats parser (same version the history was built with)
        run: python update/setup_pbp.py
      - name: update
        run: python update/run.py ${{ inputs.season && format('--season {0}', inputs.season) || '' }} --site-url "${{ vars.SITE_URL || 'https://YOUR-SITE.netlify.app' }}"
      - name: commit the new site
        run: python update/commit.py
      - name: logs
        if: failure()
        uses: actions/upload-artifact@v4
        with: { name: update-logs, path: update/tmp/*.log, if-no-files-found: ignore }
