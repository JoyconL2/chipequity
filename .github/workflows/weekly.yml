name: weekly update
# Every Monday morning: download the week's NBA games, add them to the season being played, rebuild the site into
# dist/ and commit it (Netlify, linked to this repo with publish directory "dist", then deploys it).
# Run it by hand any time from the Actions tab ("Run workflow").
on:
  schedule:
    - cron: "17 10 * * 1"        # Mondays 10:17 UTC (6:17 am Eastern)
  workflow_dispatch:
    inputs:
      season:
        description: "Season to update (blank = the one after the last finished season)"
        required: false
permissions:
  contents: write
concurrency:
  group: weekly-update
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install numpy pandas scipy requests
      - name: pbpstats parser (same version the history was built with)
        run: |
          git clone https://github.com/dblackrun/pbpstats.git pbplib
          git -C pbplib checkout e7ccf2fb6326da630a3cf1665aac964a1e108f4c
          echo "PYTHONPATH=$GITHUB_WORKSPACE/pbplib" >> $GITHUB_ENV
      - name: games already downloaded (saves re-downloading the whole season each week)
        uses: actions/cache@v4
        with:
          path: live
          key: live-${{ github.run_id }}
          restore-keys: live-
      - name: update
        run: python update/run.py ${{ inputs.season && format('--season {0}', inputs.season) || '' }} --site-url "${{ vars.SITE_URL || 'https://YOUR-SITE.netlify.app' }}"
      - name: commit the new site
        run: |
          git config user.name "weekly-update[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dist base
          if git diff --cached --quiet; then echo "no changes"; exit 0; fi
          git commit -m "Weekly update: $(python -c "import json;d=json.load(open('dist/update.json'));print(d['season'],'through',d['through'],'-',d['games'],'games')")"
          git push
      - name: logs
        if: failure()
        uses: actions/upload-artifact@v4
        with: { name: update-logs, path: update/tmp/*.log, if-no-files-found: ignore }
