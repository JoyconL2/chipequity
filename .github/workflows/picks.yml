name: model picks
# Saves the model's pick for each of today's games before tip-off into dist/picks.json (update/snap_picks.mjs opens the
# built site in a headless browser, with ESPN's live rosters and injuries, just like a visitor). The site's model record
# counts these saved picks, so a game's result is judged against the pick the site actually showed.
# Runs every hour from late morning to late night Eastern time; a game's pick stops changing once the game starts.
on:
  schedule:
    - cron: "41 15-23 * * *"
    - cron: "41 0-3 * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: model-picks
  cancel-in-progress: false
jobs:
  picks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "20" }
      - run: npm install --no-save --no-package-lock playwright@1.48.2
      - run: npx playwright install --with-deps chromium
      - run: node update/snap_picks.mjs
      - name: betting board (owner's private picks page)
        run: python3 update/bets_snap.py
        continue-on-error: true
      - name: commit
        run: |
          git config user.name "model-picks[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dist/picks.json bets
          if git diff --cached --quiet; then echo "no changes"; exit 0; fi
          git commit -q -m "Model picks $(date -u +%Y-%m-%dT%H:%MZ)"
          for i in 1 2 3 4 5; do git pull -q --rebase origin main && git push -q && exit 0; sleep 20; done
          exit 1
