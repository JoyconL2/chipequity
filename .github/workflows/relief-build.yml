name: relief build
# one-off: clock relief from NBA.com live play-by-play for finished seasons
on:
  push:
    branches: [relief-build]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        season: ["2024-25", "2025-26"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip -q install pandas numpy requests
      - run: mkdir -p out && python3 oneoff/relief_fetch.py ${{ matrix.season }}
      - uses: actions/upload-artifact@v4
        with: { name: "relief-${{ matrix.season }}", path: out/ }
  collect:
    needs: build
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { path: arts }
      - run: |
          mkdir -p oneoff/relief && find arts -name "relief_*.csv" -exec cp {} oneoff/relief/ \; && ls -la oneoff/relief
          git config user.name "relief-build"; git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add oneoff/relief && git commit -qm "clock relief from live play-by-play" && git push -q
