name: bets check
on:
  push:
    branches: [bets-check]
permissions:
  contents: write
jobs:
  t:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 update/props_bt.py
      - if: always()
        run: |
          git config user.name "bets-check"; git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add props_bt.json && git commit -qm "props backtest" && git push -q
