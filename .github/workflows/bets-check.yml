name: bets check
on:
  push:
    branches: [bets-check]
jobs:
  t:
    runs-on: ubuntu-latest
    steps:
      - run: |
          for S in 2016-17 2024-25; do
          curl -s -m 40 -o p.json -w "$S http %{http_code} bytes %{size_download}\n" "https://stats.nba.com/stats/leaguedashptstats?College=&Conference=&Country=&DateFrom=&DateTo=&Division=&DraftPick=&DraftYear=&GameScope=&Height=&LastNGames=0&LeagueID=00&Location=&Month=0&OpponentTeamID=0&Outcome=&PORound=0&PerMode=Totals&PlayerExperience=&PlayerOrTeam=Player&PlayerPosition=&PtMeasureType=Passing&Season=$S&SeasonSegment=&SeasonType=Regular%20Season&StarterBench=&TeamID=0&VsConference=&VsDivision=&Weight=" \
            -H "User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/130.0.0.0 Safari/537.36" -H "Referer: https://www.nba.com/" -H "Origin: https://www.nba.com" -H "Accept: application/json, text/plain, */*" -H "x-nba-stats-origin: stats" -H "x-nba-stats-token: true"
          python3 -c "
          import json; d=json.load(open('p.json')); r=d['resultSets'][0]; h=r['headers']; print(h)
          rows=sorted(r['rowSet'], key=lambda x: -x[h.index('FT_AST')])[:6]
          for x in rows: print(x[h.index('PLAYER_NAME')], 'FT_AST', x[h.index('FT_AST')], 'AST', x[h.index('AST')], 'SECONDARY', x[h.index('SECONDARY_AST')], 'POT', x[h.index('POTENTIAL_AST')])
          " || head -c 300 p.json; done
