name: bets check
on:
  push:
    branches: [bets-check]
permissions:
  contents: write
jobs:
  t:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          python3 - <<'PY'
          import json, subprocess
          UA = "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/130.0.0.0 Safari/537.36"
          get = lambda u: subprocess.run(["curl", "-s", "-m", "20", "-A", UA, u], capture_output=True, text=True).stdout
          sb = json.loads(get("https://site.api.espn.com/apis/site/v2/sports/basketball/nba/scoreboard"))
          gid = sb["events"][-1]["id"]
          props = json.loads(get(f"https://sports.core.api.espn.com/v2/sports/basketball/leagues/nba/events/{gid}/competitions/{gid}/odds/100/propBets?limit=1000"))
          json.dump(props, open("probe_props.json", "w"))
          print("props", props.get("count"), "types", sorted({i["type"]["name"] for i in props["items"]}))
          a = props["items"][0]["athlete"]["$ref"].replace("http://", "https://"); json.dump(json.loads(get(a)), open("probe_athlete.json", "w"))
          json.dump(sb, open("probe_scoreboard.json", "w"))
          summ = json.loads(get("https://site.api.espn.com/apis/site/v2/sports/basketball/nba/summary?event=401910045"))
          json.dump({"boxscore": summ.get("boxscore"), "header": summ.get("header")}, open("probe_box.json", "w"))
          PY
          git config user.name "bets-check"; git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add probe_*.json && git commit -qm "probe" && git push -q
