name: bets check
on:
  push:
    branches: [bets-check]
permissions:
  contents: write
jobs:
  t:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 update/bets_snap.py
      - run: |
          git config user.name "bets-check"; git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bets && git commit -qm "bets test" && git push -q
